<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClinicCare Distributed - Cổng Điều Hướng</title>
  
  <!-- Chuyển hướng thông minh dựa vào trạng thái phiên làm việc -->
  <script>
    (function () {
      try {
        var currentPath = window.location.pathname;
        // Chỉ kích hoạt tự động chuyển hướng khi truy cập ở trang gốc '/' hoặc '/index.html'
        // Ngăn chặn triệt để vòng lặp tải vô hạn (Infinite Loop) nếu server nạp index.html ở các route khác
        if (currentPath === '/' || currentPath === '/index.html' || currentPath === '') {
          var token = localStorage.getItem('accessToken');
          var session = localStorage.getItem('userSession');
          if (token && session) {
            window.location.replace('/patients-ui');
          } else {
            window.location.replace('/login');
          }
        }
      } catch (e) {
        window.location.replace('/login');
      }
    })();
  </script>

  <!-- Fallback Stylesheet & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-blue-500 selection:text-white">

  <div class="w-full max-w-sm bg-white rounded-2xl border border-slate-200/90 shadow-xl p-8 text-center space-y-5">
    
    <!-- Animated Medical Loading Spinner -->
    <div class="relative w-16 h-16 mx-auto flex items-center justify-center">
      <div class="absolute inset-0 rounded-2xl bg-blue-100 animate-pulse"></div>
      <div class="relative w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center shadow-md">
        <i data-lucide="activity" class="w-6 h-6 animate-spin"></i>
      </div>
    </div>

    <div>
      <h1 class="text-lg font-bold text-slate-900">
        Clinic<span class="text-blue-600">Care</span> Distributed
      </h1>
      <p class="text-xs text-slate-500 mt-1">
        Đang xác thực phiên làm việc và điều hướng vào hệ thống...
      </p>
    </div>

    <!-- Nút truy cập thủ công nếu JavaScript bị chặn -->
    <div class="space-y-2 pt-2 border-t border-slate-100">
      <a
        href="/login"
        class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition shadow-sm"
      >
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Cổng Đăng Nhập (Login)</span>
      </a>

      <a
        href="/patients-ui"
        class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 text-xs font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl transition"
      >
        <i data-lucide="users" class="w-4 h-4"></i>
        <span>Hồ Sơ Bệnh Nhân (Patients)</span>
      </a>
    </div>

    <p class="text-[11px] text-slate-400">
      Hệ thống Y tế Đa cơ sở &bull; MySQL Sharding Architecture
    </p>
  </div>

  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
